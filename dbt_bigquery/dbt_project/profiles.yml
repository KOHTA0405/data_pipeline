lightdash_profile:
  outputs:
    dev:
      dataset: raw
      job_execution_timeout_seconds: 300
      job_retries: 1
      # Lightdash環境では環境変数BIGQUERY_KEYFILE_JSONまたはGOOGLE_APPLICATION_CREDENTIALSを使用
      # keyfileは環境変数が設定されていない場合のフォールバック
      location: US
      method: service-account
      priority: interactive
      project: dev-project-kohta-401305
      threads: 1
      type: bigquery
  target: dev

dbt_project:
  outputs:
    dev:
      dataset: raw
      job_execution_timeout_seconds: 300
      job_retries: 1
      keyfile: /Users/kohta/.key/gcp/dev-service-account-dbt.json
      location: US
      method: service-account
      priority: interactive
      project: dev-project-kohta-401305
      threads: 1
      type: bigquery
    prd:
      dataset: raw
      job_execution_timeout_seconds: 300
      job_retries: 1
      keyfile: /Users/kohta/.key/gcp/prd-service-account-dbt.json
      location: US
      method: service-account
      priority: interactive
      project: prd-project-kohta-401305
      threads: 1
      type: bigquery
  target: dev

